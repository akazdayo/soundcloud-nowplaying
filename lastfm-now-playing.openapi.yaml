openapi: 3.1.0
info:
  title: Last.fm Web Services API
  version: 2.0.0
  description: |
    このアプリケーションが利用する Last.fm Web Services API の仕様です。
    `track.scrobble` と `user.getRecentTracks` は同じ `/2.0/` エンドポイントを
    method パラメータで切り替えて呼び出します。
externalDocs:
  description: Last.fm API documentation
  url: https://www.last.fm/api
servers:
  - url: https://ws.audioscrobbler.com/2.0
    description: Last.fm Web Services API
tags:
  - name: Scrobbles
    description: Last.fmへの再生情報送信
  - name: History
    description: Last.fmからの再生履歴取得

paths:
  /:
    get:
      operationId: getRecentTracks
      tags: [History]
      summary: Last.fmの再生履歴を取得する
      description: Last.fm の `user.getRecentTracks` を呼び出します。
      parameters:
        - name: method
          in: query
          required: true
          schema:
            type: string
            enum: [user.getRecentTracks]
        - name: user
          in: query
          required: true
          description: Last.fmユーザー名
          schema:
            type: string
            minLength: 1
          example: rj
        - name: api_key
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: from
          in: query
          description: このUNIX時刻（秒）以降のScrobble
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          description: このUNIX時刻（秒）以前のScrobble
          schema:
            type: integer
            minimum: 0
        - name: extended
          in: query
          description: アーティスト詳細とLoved状態を含める場合は1
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: 再生履歴、またはLast.fm APIエラー
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LastFmRecentTracksResponse'
                  - $ref: '#/components/schemas/LastFmErrorResponse'

    post:
      operationId: scrobble
      tags: [Scrobbles]
      summary: 再生情報をScrobbleする
      description: |
        Last.fm の `track.scrobble` を呼び出します。1〜50曲を送信できます。
        曲の各フィールドは `artist[0]`、`track[0]`、`timestamp[0]` のような
        添字付きフォームパラメータに展開します。`format` と `callback` を除く
        全パラメータをASCII順に連結し、shared secretを付加してMD5署名します。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LastFmScrobbleForm'
      responses:
        '200':
          description: Scrobble結果、またはLast.fm APIエラー
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LastFmScrobblesResponse'
                  - $ref: '#/components/schemas/LastFmErrorResponse'

components:
  schemas:
    ScrobbleInput:
      type: object
      additionalProperties: false
      required: [artist, track, timestamp]
      properties:
        artist:
          type: string
          minLength: 1
        track:
          type: string
          minLength: 1
        timestamp:
          type: integer
          minimum: 0
          description: 再生開始時刻（UTCのUNIX時刻、秒）
        album:
          type: string
        albumArtist:
          type: string
        mbid:
          type: string
          description: MusicBrainz recording ID
        duration:
          type: integer
          minimum: 1
          description: 曲の長さ（秒）
        trackNumber:
          type: integer
          minimum: 1
        chosenByUser:
          type: boolean
          default: true
          description: 利用者が曲を選択したか

    LastFmScrobbleForm:
      type: object
      description: |
        認証パラメータと添字付きScrobbleパラメータを含むフォームです。
        添字付きフィールドはすべて文字列として送信します。
      required: [api_key, api_sig, method, sk, format]
      properties:
        api_key:
          type: string
          minLength: 1
        api_sig:
          type: string
          pattern: '^[0-9a-f]{32}$'
        method:
          type: string
          enum: [track.scrobble]
        sk:
          type: string
          minLength: 1
        format:
          type: string
          enum: [json]
      additionalProperties:
        type: string

    LastFmCorrectableText:
      type: object
      additionalProperties: false
      required: [corrected]
      properties:
        '#text':
          type: string
        corrected:
          type: string
          enum: ['0', '1']

    LastFmIgnoredMessage:
      type: object
      additionalProperties: false
      required: ['#text', code]
      properties:
        '#text':
          type: string
        code:
          type: string

    LastFmScrobble:
      type: object
      additionalProperties: false
      required: [track, artist, album, albumArtist, timestamp, ignoredMessage]
      properties:
        track:
          $ref: '#/components/schemas/LastFmCorrectableText'
        artist:
          $ref: '#/components/schemas/LastFmCorrectableText'
        album:
          $ref: '#/components/schemas/LastFmCorrectableText'
        albumArtist:
          $ref: '#/components/schemas/LastFmCorrectableText'
        timestamp:
          type: string
        ignoredMessage:
          $ref: '#/components/schemas/LastFmIgnoredMessage'

    LastFmScrobblesResponse:
      type: object
      additionalProperties: false
      required: [scrobbles]
      properties:
        scrobbles:
          type: object
          additionalProperties: false
          required: ['@attr', scrobble]
          properties:
            '@attr':
              type: object
              additionalProperties: false
              required: [accepted, ignored]
              properties:
                accepted:
                  type: integer
                  minimum: 0
                ignored:
                  type: integer
                  minimum: 0
            scrobble:
              oneOf:
                - $ref: '#/components/schemas/LastFmScrobble'
                - type: array
                  items:
                    $ref: '#/components/schemas/LastFmScrobble'

    LastFmErrorResponse:
      type: object
      additionalProperties: true
      required: [error, message]
      properties:
        error:
          type: integer
        message:
          type: string
        links:
          type: array
          items: {}

    LastFmImage:
      type: object
      additionalProperties: false
      required: [size, '#text']
      properties:
        size:
          type: string
          enum: [small, medium, large, extralarge, mega]
        '#text':
          type: string

    LastFmBasicArtist:
      type: object
      additionalProperties: false
      required: ['#text', mbid]
      properties:
        '#text':
          type: string
        mbid:
          type: string

    LastFmExtendedArtist:
      type: object
      additionalProperties: true
      required: [name, mbid, url, image]
      properties:
        name:
          type: string
        mbid:
          type: string
        url:
          type: string
          format: uri
        image:
          type: array
          items:
            $ref: '#/components/schemas/LastFmImage'

    LastFmAlbum:
      type: object
      additionalProperties: false
      required: ['#text', mbid]
      properties:
        '#text':
          type: string
        mbid:
          type: string

    LastFmDate:
      type: object
      additionalProperties: false
      required: ['#text', uts]
      properties:
        '#text':
          type: string
        uts:
          type: string

    LastFmRecentTrack:
      type: object
      additionalProperties: false
      required: [name, mbid, url, streamable, artist, album, image]
      properties:
        name:
          type: string
        mbid:
          type: string
        url:
          type: string
          format: uri
        streamable:
          type: string
        loved:
          type: string
        artist:
          oneOf:
            - $ref: '#/components/schemas/LastFmBasicArtist'
            - $ref: '#/components/schemas/LastFmExtendedArtist'
        album:
          $ref: '#/components/schemas/LastFmAlbum'
        image:
          type: array
          items:
            $ref: '#/components/schemas/LastFmImage'
        date:
          $ref: '#/components/schemas/LastFmDate'
        '@attr':
          type: object
          additionalProperties: false
          required: [nowplaying]
          properties:
            nowplaying:
              type: string
              enum: ['true']

    LastFmRecentTracksResponse:
      type: object
      additionalProperties: false
      required: [recenttracks]
      properties:
        recenttracks:
          type: object
          additionalProperties: false
          required: [track, '@attr']
          properties:
            track:
              type: array
              items:
                $ref: '#/components/schemas/LastFmRecentTrack'
            '@attr':
              type: object
              additionalProperties: false
              required: [user, page, perPage, totalPages, total]
              properties:
                user:
                  type: string
                page:
                  type: string
                perPage:
                  type: string
                totalPages:
                  type: string
                total:
                  type: string
