openapi: 3.1.0

info:
  title: SoundCloud Internal API (Unofficial)
  version: 0.2.0
  description: |
    Unofficial, reverse-engineered subset of SoundCloud's api-v2 used by the web client.
    This API is undocumented and may change without notice.

servers:
  - url: https://api-v2.soundcloud.com

paths:
  /tracks:
    get:
      operationId: getTracks
      summary: Get track metadata by track IDs
      description: |
        Fetch one or more tracks by numeric track ID.

        The SoundCloud web client sends the IDs as a comma-separated
        `ids` query parameter. A single track is also requested through
        this endpoint, for example `ids=2009643255`.

        The response is always an array of Track objects.
      parameters:
        - $ref: '#/components/parameters/TrackIds'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppLocale'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/DataDomeClientId'
      responses:
        '200':
          description: Track collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '400':
          description: Invalid request
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden

  /me/play-history/tracks:
    get:
      operationId: getPlayHistoryTracks
      summary: Get the authenticated user's listening-history tracks
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LinkedPartitioning'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppLocale'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OAuthToken'
        - $ref: '#/components/parameters/DataDomeClientId'
      responses:
        '200':
          description: Play-history track collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayHistoryResponse'
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden

  /me/play-history/contexts:
    get:
      operationId: getPlayHistoryContexts
      summary: Get listening-history contexts
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/LinkedPartitioning'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppLocale'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OAuthToken'
        - $ref: '#/components/parameters/DataDomeClientId'
      responses:
        '200':
          description: Play-history context collection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden

  /me/play-history:
    post:
      operationId: addPlayHistory
      summary: Add an item to play history
      description: |
        Request body is intentionally unspecified until captured
        from the current SoundCloud web client.
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppLocale'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OAuthToken'
        - $ref: '#/components/parameters/DataDomeClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
        '201':
          description: Created
        '204':
          description: No content
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden

    delete:
      operationId: clearPlayHistory
      summary: Clear play history
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/AppLocale'
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/OAuthToken'
        - $ref: '#/components/parameters/DataDomeClientId'
      responses:
        '200':
          description: Cleared
        '204':
          description: Cleared
        '401':
          description: Authentication required or invalid
        '403':
          description: Forbidden

components:
  parameters:
    TrackIds:
      name: ids
      in: query
      required: true
      description: |
        Comma-separated numeric SoundCloud track IDs.

        Examples:
        - `337321766`
        - `2165585610,336219436,337321766`
      schema:
        type: string

    ClientId:
      name: client_id
      in: query
      required: true
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 25

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    LinkedPartitioning:
      name: linked_partitioning
      in: query
      required: false
      schema:
        type: boolean
        default: true

    AppVersion:
      name: app_version
      in: query
      required: false
      description: SoundCloud web-client application version.
      schema:
        type: string

    AppLocale:
      name: app_locale
      in: query
      required: false
      schema:
        type: string
        default: en

    Authorization:
      name: Authorization
      in: header
      required: false
      description: |
        Authentication header used by the SoundCloud web client.

        Example format:
        `OAuth <token>`
      schema:
        type: string

    DataDomeClientId:
      name: x-datadome-clientid
      in: header
      required: false
      description: |
        DataDome client identifier sent by the SoundCloud web client.
        This appears to be related to SoundCloud's anti-abuse system
        and may not be required for all requests.
      schema:
        type: string

    OAuthToken:
      name: oauth_token
      in: query
      required: false
      description: |
        Historical web-client authentication parameter.
        Current web-client traffic primarily uses the Authorization header.
      schema:
        type: string

  schemas:
    PlayHistoryResponse:
      type: object
      required:
        - collection
        - next_href
        - query_urn
      properties:
        collection:
          type: array
          items:
            $ref: '#/components/schemas/PlayHistoryItem'

        next_href:
          type:
            - string
            - 'null'

        query_urn:
          type:
            - string
            - 'null'

      additionalProperties: true

    PlayHistoryItem:
      type: object
      required:
        - played_at
        - track_id
        - track
      properties:
        played_at:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the track was played.

        track_id:
          type: integer
          format: int64

        track:
          $ref: '#/components/schemas/Track'

      additionalProperties: true

    Track:
      type: object
      description: |
        Track representation returned by SoundCloud api-v2.
        Fields may vary depending on account state, availability,
        monetization, region, and endpoint representation.
      properties:
        artwork_url:
          type:
            - string
            - 'null'

        caption:
          type:
            - string
            - 'null'

        commentable:
          type: boolean

        comment_count:
          type: integer

        created_at:
          type: string
          format: date-time

        description:
          type:
            - string
            - 'null'

        downloadable:
          type: boolean

        download_count:
          type: integer

        duration:
          type: integer
          description: Track duration in milliseconds.

        full_duration:
          type: integer
          description: Full track duration in milliseconds.

        embeddable_by:
          type: string

        genre:
          type:
            - string
            - 'null'

        has_downloads_left:
          type: boolean

        id:
          type: integer
          format: int64

        kind:
          type: string

        label_name:
          type:
            - string
            - 'null'

        last_modified:
          type: string
          format: date-time

        license:
          type: string

        likes_count:
          type: integer

        permalink:
          type: string

        permalink_url:
          type: string
          format: uri

        playback_count:
          type: integer

        public:
          type: boolean

        publisher_metadata:
          oneOf:
            - $ref: '#/components/schemas/PublisherMetadata'
            - type: 'null'

        purchase_title:
          type:
            - string
            - 'null'

        purchase_url:
          type:
            - string
            - 'null'

        release_date:
          type:
            - string
            - 'null'
          format: date-time

        reposts_count:
          type: integer

        secret_token:
          type:
            - string
            - 'null'

        sharing:
          type: string

        state:
          type: string

        streamable:
          type: boolean

        tag_list:
          type: string

        title:
          type: string

        uri:
          type: string
          format: uri

        urn:
          type: string
          examples:
            - soundcloud:tracks:2009643255

        user_id:
          type: integer
          format: int64

        visuals:
          type:
            - object
            - 'null'
          additionalProperties: true

        waveform_url:
          type: string
          format: uri

        display_date:
          type:
            - string
            - 'null'
          format: date-time

        media:
          $ref: '#/components/schemas/Media'

        station_urn:
          type:
            - string
            - 'null'

        station_permalink:
          type:
            - string
            - 'null'

        track_authorization:
          type:
            - string
            - 'null'
          description: Authorization token used when requesting media streams.

        monetization_model:
          type:
            - string
            - 'null'

        policy:
          type:
            - string
            - 'null'

        user:
          $ref: '#/components/schemas/User'

      additionalProperties: true

    PublisherMetadata:
      type: object
      properties:
        id:
          type: integer
          format: int64

        urn:
          type: string

        artist:
          type:
            - string
            - 'null'

        album_title:
          type:
            - string
            - 'null'

        contains_music:
          type:
            - boolean
            - 'null'

        explicit:
          type:
            - boolean
            - 'null'

        isrc:
          type:
            - string
            - 'null'

        publisher:
          type:
            - string
            - 'null'

        release_title:
          type:
            - string
            - 'null'

        writer_composer:
          type:
            - string
            - 'null'

      additionalProperties: true

    Media:
      type: object
      properties:
        transcodings:
          type: array
          items:
            $ref: '#/components/schemas/Transcoding'

      additionalProperties: true

    Transcoding:
      type: object
      properties:
        url:
          type: string
          format: uri

        preset:
          type: string

        duration:
          type: integer
          description: Duration in milliseconds.

        snipped:
          type: boolean

        format:
          $ref: '#/components/schemas/TranscodingFormat'

        quality:
          type: string
          examples:
            - sq
            - lq

        is_legacy_transcoding:
          type: boolean

      additionalProperties: true

    TranscodingFormat:
      type: object
      properties:
        protocol:
          type: string
          examples:
            - hls
            - progressive

        mime_type:
          type: string
          examples:
            - audio/mpeg
            - audio/mpegurl
            - audio/mp4; codecs="mp4a.40.2"

      additionalProperties: true

    User:
      type: object
      properties:
        avatar_url:
          type:
            - string
            - 'null'

        first_name:
          type: string

        followers_count:
          type: integer

        full_name:
          type: string

        id:
          type: integer
          format: int64

        kind:
          type: string

        last_modified:
          type: string
          format: date-time

        last_name:
          type: string

        permalink:
          type: string

        permalink_url:
          type: string
          format: uri

        uri:
          type: string
          format: uri

        urn:
          type: string

        username:
          type: string

        verified:
          type: boolean

        city:
          type:
            - string
            - 'null'

        country_code:
          type:
            - string
            - 'null'

        badges:
          $ref: '#/components/schemas/UserBadges'

        station_urn:
          type:
            - string
            - 'null'

        station_permalink:
          type:
            - string
            - 'null'

      additionalProperties: true

    UserBadges:
      type: object
      properties:
        pro:
          type: boolean

        creator_mid_tier:
          type: boolean

        pro_unlimited:
          type: boolean

        verified:
          type: boolean

      additionalProperties: true
